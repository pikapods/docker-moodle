name: Build and publish

on:
  workflow_dispatch:
    inputs:
      moodle_version:
        description: "Moodle version tag (e.g. v5.2.0)"
        required: true
        type: string
      php_version:
        description: "PHP minor version"
        required: false
        default: "8.3"
        type: string
      publish:
        description: "Publish to GHCR / Docker Hub after tests pass"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      moodle_version: ${{ steps.vars.outputs.moodle_version }}
      php_version: ${{ steps.vars.outputs.php_version }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build args
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOODLE_VER="${{ inputs.moodle_version }}"
            PHP_VER="${{ inputs.php_version }}"
          else
            # Tag form: v<moodle-version> (e.g. v5.2.0). The `v` prefix is
            # part of the upstream tag, so use GITHUB_REF_NAME verbatim.
            MOODLE_VER="${GITHUB_REF_NAME}"
            PHP_VER="8.3"
          fi
          echo "moodle_version=$MOODLE_VER" >>"$GITHUB_OUTPUT"
          echo "php_version=$PHP_VER"       >>"$GITHUB_OUTPUT"
          echo "image_tag=${MOODLE_VER}-php${PHP_VER}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image (local load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            MOODLE_VERSION=${{ steps.vars.outputs.moodle_version }}
            PHP_VERSION=${{ steps.vars.outputs.php_version }}
          tags: moodle:test
          # Keep Docker manifest schema (not OCI) so podman preserves the
          # HEALTHCHECK instruction set in the Dockerfile.
          provenance: false

      - name: Save image tarball
        run: docker save moodle:test -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  compose-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Bring up compose stack
        env:
          MOODLE_IMAGE: moodle:test
        run: docker compose up -d

      - name: Wait for /login/index.php to return 200
        # While config.php is unconfigured, /login/index.php redirects to
        # /install.php (3xx). Poll until 200 to confirm install completed.
        # Moodle install.php is slow on cold boot — allow ~6 min.
        run: |
          for i in $(seq 1 180); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login/index.php || echo "000")
            if [ "$code" = "200" ]; then
              echo "ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for /login/index.php"
          exit 1

      - name: Assert healthcheck propagated
        # Dockerfile HEALTHCHECK: interval=30s, start-period=180s, retries=3.
        # First probe can fire up to 180s after start. Poll up to ~3 min
        # after readiness, expecting `healthy`.
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}}' moodle-moodle-1)
            echo "health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy"
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for healthy status"
          exit 1

      - name: Assert clean first boot
        run: |
          restarts=$(docker inspect --format '{{.RestartCount}}' moodle-moodle-1)
          echo "restart count: $restarts"
          [ "$restarts" = "0" ] || exit 1
          if docker compose logs moodle 2>&1 | grep -E 'not reachable|FATAL|Restarting'; then
            echo "found error markers in moodle logs"
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    needs: [build, compose-test]
    # Tag pushes always publish. Manual dispatch publishes unless the
    # `publish` input is set to false (test-only runs).
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push three refs to each registry:
      #   <version>-php<minor>   fully qualified (e.g. v5.2.0-php8.3)
      #   <version>              plain Moodle version alias (e.g. v5.2.0) —
      #                          resolves to whichever PHP build this run produced
      #   latest                 floating pointer to the most recent build
      #
      # docker save + docker push preserve the Docker manifest schema (not OCI),
      # which is what the podman HEALTHCHECK rationale in the Dockerfile depends on.
      - name: Tag and push
        env:
          MOODLE_VER: ${{ needs.build.outputs.moodle_version }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/docker-moodle
        run: |
          set -euo pipefail
          for REPO in "${REGISTRY}/${IMAGE_NAME}" "docker.io/${DOCKERHUB_REPO}"; do
            docker tag moodle:test "${REPO}:${IMAGE_TAG}"
            docker tag moodle:test "${REPO}:${MOODLE_VER}"
            docker tag moodle:test "${REPO}:latest"
            docker push "${REPO}:${IMAGE_TAG}"
            docker push "${REPO}:${MOODLE_VER}"
            docker push "${REPO}:latest"
          done
