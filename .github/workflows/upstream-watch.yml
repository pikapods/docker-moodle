name: Upstream watch

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.3"
  # Pinned upstream series (major.minor). Auto-rebuilds fire for any new
  # release in this line — stable patch bumps (v5.2.0 -> v5.2.1) and
  # prereleases alike (v5.2.0-rc1, v5.2.0-beta). Only stable releases
  # promote the floating 'latest' tag; that gate lives in build.yml.
  # The watcher is forward-only: it reacts to releases published in the
  # last 24h, so it does not backfill historical prereleases on rollout
  # or after a SERIES bump. Use workflow_dispatch on build.yml directly
  # for one-off or out-of-series builds.
  SERIES: "5.2"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - name: Find unbuilt upstream releases in series
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Forward-only window. We don't want to backfill existing
          # prereleases when this watcher rolls out — only react to
          # releases published since the previous cycle. 24h covers a
          # missed cron run (and then some) without going stateful.
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Unlike releases/latest, the releases list endpoint includes
          # prereleases (rc, beta). We want those built too — build.yml
          # gates the floating 'latest' tag on a stable version regex,
          # so prereleases publish under their own tag only. Weekly
          # snapshot tags (with '+' suffix) are not published as Releases
          # and remain excluded here.
          mapfile -t releases < <(
            gh api 'repos/moodle/moodle/releases?per_page=20' \
              --jq ".[] | select(.published_at >= \"${cutoff}\") | .tag_name"
          )

          if [ "${#releases[@]}" -eq 0 ]; then
            echo "no releases published since ${cutoff}"
            exit 0
          fi

          token=$(curl -fsS "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${IMAGE_NAME}:pull" | jq -r .token)

          pending=()
          for upstream in "${releases[@]}"; do
            # Series guard. Strip leading 'v', drop any prerelease suffix,
            # then take everything before the last dot to get MAJOR.MINOR.
            base="${upstream#v}"
            base="${base%%-*}"
            series="${base%.*}"
            if [ "${series}" != "${SERIES}" ]; then
              echo "${upstream} outside series ${SERIES}; skipping"
              continue
            fi

            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${upstream}")

            if [ "${status}" = "200" ]; then
              echo "${upstream} already published"
            else
              echo "${upstream} not in registry (HTTP ${status}); will trigger build"
              pending+=("${upstream}")
            fi
          done

          {
            echo "pending<<EOF"
            printf '%s\n' "${pending[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Trigger builds
        if: steps.check.outputs.pending != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: ${{ steps.check.outputs.pending }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh workflow run build.yml \
              -f moodle_version="$tag" \
              -f php_version="${PHP_VERSION}"
          done <<<"$PENDING"
