name: Upstream watch

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.3"
  # Pinned upstream series (major.minor). Auto-rebuilds fire for any new
  # release in this line — stable patch bumps (v5.2.0 -> v5.2.1) and
  # prereleases alike (v5.2.0-rc1, v5.2.0-beta). Only stable releases
  # promote the floating 'latest' tag; that gate lives in build.yml.
  #
  # Two independent triggers:
  #
  # 1. New-version detection. Forward-only 24h window — reacts to
  #    releases published since the previous cycle, so it does not
  #    backfill historical prereleases on rollout or after a SERIES
  #    bump. Use workflow_dispatch on build.yml directly for one-off
  #    or out-of-series builds.
  #
  # 2. Base-image drift detection. Resolves the current
  #    serversideup/php digest and compares against the digest recorded
  #    in the published image's OCI labels. Drift is scoped to the
  #    latest stable in-series tag only — older patch releases and
  #    prereleases are not rebuilt on drift. The rebuild bumps the
  #    immutable -rN suffix and refreshes the mutable <version> tag in
  #    place, so users pinned to v5.2.0 receive Alpine/PHP/nginx
  #    security patches without re-pinning.
  SERIES: "5.2"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - uses: imjasonh/setup-crane@v0.4

      - name: Find builds to trigger
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE_REF="serversideup/php:${PHP_VERSION}-fpm-nginx-alpine"
          current_digest=$(crane digest "${BASE_REF}")
          echo "current base digest: ${current_digest}"

          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Moodle does not publish GitHub Releases — only git tags.
          # Fetch tag names + their target commit dates in a single
          # GraphQL call. ALPHABETICAL DESC happens to surface the
          # current series first for moodle (vMAJ.MIN sort), so 30 tags
          # covers all recent activity. The forward-only 24h window
          # filters by committedDate; this catches stable patch bumps
          # and prereleases alike (rc, beta). Weekly snapshot tags
          # (with '+' suffix) are not promoted to first-class tags and
          # remain excluded.
          all_tags_json=$(gh api graphql -f query='
            {
              repository(owner: "moodle", name: "moodle") {
                refs(refPrefix: "refs/tags/", first: 30, orderBy: {field: ALPHABETICAL, direction: DESC}) {
                  nodes {
                    name
                    target {
                      ... on Commit { committedDate }
                      ... on Tag { target { ... on Commit { committedDate } } }
                    }
                  }
                }
              }
            }')

          # Project to {name, date} so the rest of the script is shape-stable.
          all_tags=$(echo "${all_tags_json}" | jq -c '[
            .data.repository.refs.nodes[]
            | {name, date: (.target.committedDate // .target.target.committedDate)}
          ]')

          mapfile -t recent < <(
            echo "${all_tags}" \
              | jq -r --arg cutoff "${cutoff}" '.[] | select(.date >= $cutoff) | .name'
          )

          token=$(curl -fsS "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${IMAGE_NAME}:pull" | jq -r .token)

          pending=()
          declare -A reasons=()

          # --- 1. New-version detection ---
          for upstream in "${recent[@]}"; do
            [ -n "${upstream}" ] || continue
            # Series guard. Strip leading 'v', drop any prerelease
            # suffix, then take everything before the last dot to get
            # MAJOR.MINOR.
            base="${upstream#v}"
            base="${base%%-*}"
            series="${base%.*}"
            if [ "${series}" != "${SERIES}" ]; then
              echo "${upstream} outside series ${SERIES}; skipping"
              continue
            fi

            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${upstream}")

            if [ "${status}" = "200" ]; then
              echo "${upstream} already published"
            else
              echo "${upstream} not in registry (HTTP ${status}); will trigger build"
              pending+=("${upstream}")
              reasons["${upstream}"]="new-version"
            fi
          done

          # --- 2. Base-image drift detection (latest stable in-series only) ---
          series_re="^v${SERIES//./\\.}\.[0-9]+\$"
          latest_stable=$(
            echo "${all_tags}" \
              | jq -r '.[].name' \
              | grep -E "${series_re}" \
              | sort -V \
              | tail -n 1 || true
          )

          drift_skip=""
          if [ -z "${latest_stable}" ]; then
            drift_skip="no stable release found in series ${SERIES}"
          elif [ "${#pending[@]}" -gt 0 ] && printf '%s\n' "${pending[@]}" | grep -qFx "${latest_stable}"; then
            drift_skip="${latest_stable} already pending as new-version"
          fi

          if [ -n "${drift_skip}" ]; then
            echo "drift check skipped: ${drift_skip}"
          else
            cfg=$(crane config "${REGISTRY}/${IMAGE_NAME}:${latest_stable}" 2>/dev/null || true)
            if [ -z "${cfg}" ]; then
              echo "${latest_stable} not yet in registry; drift check N/A"
            else
              published_digest=$(echo "${cfg}" | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty')
              if [ "${published_digest}" = "${current_digest}" ]; then
                echo "${latest_stable} base digest matches (${current_digest}); no drift"
              else
                echo "${latest_stable} base drift: published=${published_digest:-<none>} current=${current_digest}; will trigger rebuild"
                pending+=("${latest_stable}")
                reasons["${latest_stable}"]="base-drift"
              fi
            fi
          fi

          if [ "${#pending[@]}" -eq 0 ]; then
            echo "nothing to build"
            exit 0
          fi

          echo "triggering builds:"
          for tag in "${pending[@]}"; do
            echo "  - ${tag} (${reasons[$tag]})"
          done

          {
            echo "pending<<EOF"
            printf '%s\n' "${pending[@]}"
            echo "EOF"
            echo "base_digest=${current_digest}"
          } >>"$GITHUB_OUTPUT"

      - name: Trigger builds
        if: steps.check.outputs.pending != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: ${{ steps.check.outputs.pending }}
          BASE_DIGEST: ${{ steps.check.outputs.base_digest }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh workflow run build.yml \
              --repo "${GITHUB_REPOSITORY}" \
              -f moodle_version="$tag" \
              -f php_version="${PHP_VERSION}" \
              -f base_digest="${BASE_DIGEST}"
          done <<<"$PENDING"
