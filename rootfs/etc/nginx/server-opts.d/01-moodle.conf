# Moodle-specific nginx overrides.
#
# serversideup/php-nginx renders site-opts.d/http.conf.template at boot into
# the active server block and `include /etc/nginx/server-opts.d/*.conf;` at
# the end. Files in site-opts.d/ that are NOT named `.template` are ignored,
# so app overrides must live here. The `01-` prefix sorts this file *before*
# the base image's performance.conf, which is necessary because
# performance.conf defines a static-asset regex location (`\.(?:png|jpg|...)
# $`) that would otherwise intercept Moodle slasharguments URLs such as
# `/pluginfile.php/123/icon.png` and serve a 404 from disk.

# Moodle's default upload limit is 100 MB; match it here so nginx does not
# reject before php-fpm sees the request.
client_max_body_size 100m;

# Moodle "slasharguments" support — URLs like /pluginfile.php/123/foo/bar
# must route to pluginfile.php with the trailing path in PATH_INFO. The
# base image's `location ~ \.php$` only matches URLs that *end* in `.php`,
# so slash-arg requests fall through to static handlers and 404. This block
# is checked first (alphabetical include order) and only fires for URLs of
# the form `something.php/...` — plain `.php` URLs still hit the base
# handler thanks to nginx's first-match-wins regex ordering.
location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info  ^(.+?\.php)(/.*)$;
    fastcgi_index            index.php;
    fastcgi_pass             127.0.0.1:9000;
    include                  fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
}
